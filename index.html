<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Landroid</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <!-- HUD (DOM layer; catalog and telemetry use pre elements for monospace alignment) -->
    <div id="hud">
        <pre id="catalog"></pre>
        <div id="hud-bottom">
            <pre id="autopilot-status"></pre>
            <div id="telemetry-row">
                <pre id="telemetry"></pre>
                <button id="autoBtn" title="Toggle autopilot">AUTO</button>
            </div>
        </div>
    </div>

        <button id="autoBtn" title="Toggle autopilot">AUTO</button>
    </div>

    <div id="loading">INITIALIZING UNIVERSE…</div>

    <script type="module" src="src/main.js"></script>

    <script type="module">
        // Hide loading screen once main.js has set up the first frame
        // We do this by waiting one rAF after module load
        window.addEventListener('load', () => {
            requestAnimationFrame(() => {
                const el = document.getElementById('loading');
                if (el) el.remove();
            });
        });
    </script>
</body>
</html>
