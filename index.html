<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Landroid</title>
    <style>
        *, *::before, *::after {
            margin: 0; padding: 0; box-sizing: border-box;
        }

        html, body {
            width: 100%; height: 100%;
            background: #16161D;
            overflow: hidden;
            font-family: monospace;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0; left: 0;
            touch-action: none;  /* prevent scroll/zoom on touch */
        }

        /* HUD overlay — pointer-events: none so clicks pass through to canvas */
        #hud {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
        }

        /* Top-left: star catalog + explored planets */
        #catalog {
            position: absolute;
            top: 6px; left: 6px;
            color: #B7B7FF;
            font: 12px/12px monospace;
            letter-spacing: 1px;
            white-space: pre;
        }

        /* Bottom-left column: autopilot + telemetry stacked */
        #bottom-left {
            position: absolute;
            bottom: 44px; left: 6px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
        }

        /* Autopilot status (above telemetry when engaged) */
        #autopilot-status {
            color: #4285F4;
            font: 12px/12px monospace;
            letter-spacing: 1px;
            white-space: pre;
        }

        /* Bottom-left: ship telemetry */
        #telemetry {
            color: #B7B7FF;
            font: 12px/12px monospace;
            letter-spacing: 1px;
            white-space: pre;
        }
        /* Bottom-right: AUTO button */
        #autoBtn {
            position: absolute;
            bottom: 6px; right: 6px;
            pointer-events: auto;   /* button needs clicks */
            background: transparent;
            border: 1.5px solid #B7B7FF;
            color: #B7B7FF;
            font: 12px/12px monospace;
            letter-spacing: 2px;
            padding: 6px 10px;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            transition: background 0.2s, color 0.2s;
        }

        #autoBtn:hover {
            background: rgba(183, 183, 255, 0.15);
        }

        /* Loading screen */
        #loading {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #B7B7FF;
            font: 14px/1.5 monospace;
            letter-spacing: 2px;
            text-align: center;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <!-- HUD (DOM layer; catalog and telemetry use pre elements for monospace alignment) -->
    <div id="hud">
        <pre id="catalog"></pre>

        <!-- autopilot text + telemetry in a bottom-left column -->
        <div id="bottom-left">
            <pre id="autopilot-status"></pre>
            <pre id="telemetry"></pre>
        </div>

        <button id="autoBtn" title="Toggle autopilot">AUTO</button>
    </div>

    <div id="loading">INITIALIZING UNIVERSE…</div>

    <script type="module" src="src/main.js"></script>

    <script type="module">
        // Hide loading screen once main.js has set up the first frame
        // We do this by waiting one rAF after module load
        window.addEventListener('load', () => {
            requestAnimationFrame(() => {
                const el = document.getElementById('loading');
                if (el) el.remove();
            });
        });
    </script>
</body>
</html>
