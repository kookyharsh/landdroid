<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Landroid</title>
    <style>
        *, *::before, *::after {
            margin: 0; padding: 0; box-sizing: border-box;
        }

        html, body {
            width: 100%; height: 100%;
            background: #16161D;
            overflow: hidden;
            font-family: 'SF Mono', 'Roboto Mono', 'Cascadia Code', 'Consolas', 'Menlo', monospace;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0; left: 0;
            touch-action: none;  /* prevent scroll/zoom on touch */
        }

        /* HUD overlay — pointer-events: none so clicks pass through to canvas */
        #hud {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
        }

        /* Top-left: star catalog + explored planets */
        #catalog {
            position: absolute;
            top: 6px; left: 6px;
            color: #B7B7FF;
            font-size: 12px;
            line-height: 14px;
            letter-spacing: 1px;
            white-space: pre;
            max-height: calc(100vh - 120px);
            overflow-y: auto;
            scrollbar-width: none;
        }
        #catalog::-webkit-scrollbar {
            display: none;
        }

        /* Bottom HUD container */
        #hud-bottom {
            position: absolute;
            bottom: 6px;
            left: 6px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
            pointer-events: none;
        }

        /* Responsive placement on wide desktop screens matching Android's Alignment.BottomEnd */
        @media (min-aspect-ratio: 1/1) {
            #hud-bottom {
                left: auto;
                right: 6px;
                align-items: flex-end;
            }
        }

        /* Autopilot status (above telemetry when engaged) */
        #autopilot-status {
            color: #4285F4;
            font-size: 12px;
            line-height: 14px;
            letter-spacing: 1px;
            white-space: pre;
        }

        /* Telemetry row: telemetry text + AUTO button side-by-side */
        #telemetry-row {
            display: flex;
            align-items: flex-end;
            gap: 10px;
        }

        #telemetry {
            color: #B7B7FF;
            font-size: 12px;
            line-height: 14px;
            letter-spacing: 1px;
            white-space: pre;
        }

        /* AUTO button */
        #autoBtn {
            pointer-events: auto;
            background: transparent;
            border: 1px solid #B7B7FF;
            color: #B7B7FF;
            font-family: inherit;
            font-size: 12px;
            line-height: 12px;
            letter-spacing: 1px;
            padding: 6px 10px;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            transition: background 0.2s, color 0.2s;
        }

        #autoBtn:hover {
            background: rgba(183, 183, 255, 0.15);
        }

        /* Loading screen */
        #loading {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #B7B7FF;
            font-size: 14px;
            line-height: 1.5;
            letter-spacing: 2px;
            text-align: center;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <!-- HUD (DOM layer; catalog and telemetry use pre elements for monospace alignment) -->
    <div id="hud">
        <pre id="catalog"></pre>
        <div id="hud-bottom">
            <pre id="autopilot-status"></pre>
            <div id="telemetry-row">
                <pre id="telemetry"></pre>
                <button id="autoBtn" title="Toggle autopilot">AUTO</button>
            </div>
        </div>
    </div>

        <button id="autoBtn" title="Toggle autopilot">AUTO</button>
    </div>

    <div id="loading">INITIALIZING UNIVERSE…</div>

    <script type="module" src="src/main.js"></script>

    <script type="module">
        // Hide loading screen once main.js has set up the first frame
        // We do this by waiting one rAF after module load
        window.addEventListener('load', () => {
            requestAnimationFrame(() => {
                const el = document.getElementById('loading');
                if (el) el.remove();
            });
        });
    </script>
</body>
</html>
